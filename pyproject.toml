[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iwork-collector"
version = "0.1.15"
description = "Local iWork bug evidence collection and Markdown reports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iwork-collector = "iwork_collector.cli:main"

[tool.setuptools.packages.find]
include = ["iwork_collector*"]
